# Prometheus + Alertmanager + Grafana + node-exporter + kube-state-metrics.
fullnameOverride: kube-prometheus-stack

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    # Pick up ServiceMonitors / PrometheusRules from every namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    scrapeInterval: 15s
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
    storageSpec: {}   # emptyDir on Kind; use a PVC in real clusters

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

grafana:
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 30300
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki-gateway.observability.svc.cluster.local
      access: proxy
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"(\w+)"'
            datasourceUid: jaeger
            url: "$${__value.raw}"
    - name: Jaeger
      uid: jaeger
      type: jaeger
      url: http://jaeger-query.observability.svc.cluster.local:16686
      access: proxy
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer

# Kind control-plane components listen on localhost only; skip them.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }
