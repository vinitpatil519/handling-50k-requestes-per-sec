- name: Worker environment
  ansible.builtin.copy:
    dest: /etc/default/titanload-worker
    mode: "0600"
    content: |
      TITANLOAD_COORDINATOR={{ titanload_coordinator_url }}
      TITANLOAD_TOKEN={{ titanload_token }}
      TITANLOAD_WORKER_NAME={{ inventory_hostname }}
  no_log: true
  notify: Restart titanload worker

- name: systemd unit
  ansible.builtin.template:
    src: titanload-worker.service.j2
    dest: /etc/systemd/system/titanload-worker.service
    mode: "0644"
  notify: Restart titanload worker

- name: Worker running
  ansible.builtin.systemd:
    name: titanload-worker
    state: started
    enabled: true
    daemon_reload: true
