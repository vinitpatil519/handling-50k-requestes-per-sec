{{- $c := dict "root" . "name" "envoy" -}}
{{- $v := .Values.envoy -}}
{{- $api := include "titan.component" (dict "root" . "name" "api") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "titan.component" $c }}
  labels:
    {{- include "titan.labels" $c | nindent 4 }}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    overload_manager:
      refresh_interval: 0.25s
      resource_monitors:
        - name: envoy.resource_monitors.global_downstream_max_connections
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
            max_active_downstream_connections: 50000
    static_resources:
      listeners:
        - name: ingress_http
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          per_connection_buffer_limit_bytes: 1048576
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    codec_type: AUTO
                    use_remote_address: true
                    xff_num_trusted_hops: 1
                    preserve_external_request_id: true
                    generate_request_id: true
                    common_http_protocol_options:
                      idle_timeout: 300s
                    http2_protocol_options:
                      max_concurrent_streams: 1024
                      initial_stream_window_size: 1048576
                      initial_connection_window_size: 4194304
                    tracing:
                      random_sampling: { value: {{ $v.traceSamplePercent }} }
                      provider:
                        name: envoy.tracers.opentelemetry
                        typed_config:
                          "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                          service_name: titan-envoy
                          grpc_service:
                            envoy_grpc: { cluster_name: otel_collector }
                            timeout: 1s
                    access_log:
                      - name: envoy.access_loggers.stdout
                        filter:
                          or_filter:
                            filters:
                              - status_code_filter:
                                  comparison: { op: GE, value: { default_value: 500, runtime_key: access_log.min_status } }
                              - runtime_filter:
                                  runtime_key: access_log.sample
                                  percent_sampled: { numerator: 1, denominator: HUNDRED }
                                  use_independent_randomness: true
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              ts: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                              status: "%RESPONSE_CODE%"
                              flags: "%RESPONSE_FLAGS%"
                              duration_ms: "%DURATION%"
                              upstream_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                              upstream: "%UPSTREAM_HOST%"
                              request_id: "%REQ(X-REQUEST-ID)%"
                              trace_id: "%TRACE_ID%"
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: titan_api
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/api/" }
                              route:
                                cluster: titan_api
                                timeout: 15s
                                retry_policy:
                                  retry_on: connect-failure,refused-stream,reset-before-request
                                  num_retries: 2
                                  per_try_timeout: 5s
                                  retry_back_off: { base_interval: 0.01s, max_interval: 0.1s }
                            - match: { prefix: "/" }
                              direct_response:
                                status: 404
                                body: { inline_string: "{\"error\":\"not found\"}" }
                    http_filters:
                      {{- if $v.rateLimit.enabled }}
                      - name: envoy.filters.http.local_ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: edge_rate_limit
                          token_bucket:
                            max_tokens: {{ int64 $v.rateLimit.maxTokens }}
                            tokens_per_fill: {{ int64 $v.rateLimit.tokensPerFill }}
                            fill_interval: {{ $v.rateLimit.fillInterval }}
                          filter_enabled:
                            runtime_key: local_rate_limit_enabled
                            default_value: { numerator: 100, denominator: HUNDRED }
                          filter_enforced:
                            runtime_key: local_rate_limit_enforced
                            default_value: { numerator: 100, denominator: HUNDRED }
                          response_headers_to_add:
                            - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                              header: { key: x-ratelimited, value: "true" }
                      {{- end }}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: titan_api
          type: STRICT_DNS
          dns_refresh_rate: 5s
          dns_lookup_family: V4_ONLY
          lb_policy: LEAST_REQUEST
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              common_http_protocol_options:
                idle_timeout: 60s
              explicit_http_config:
                http2_protocol_options:
                  max_concurrent_streams: 1000
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: {{ int64 $v.circuitBreaker.maxConnections }}
                max_pending_requests: {{ int64 $v.circuitBreaker.maxPendingRequests }}
                max_requests: {{ int64 $v.circuitBreaker.maxRequests }}
                retry_budget:
                  budget_percent: { value: 20 }
                  min_retry_concurrency: 10
          outlier_detection:
            consecutive_5xx: 5
            consecutive_gateway_failure: 3
            interval: 5s
            base_ejection_time: 15s
            max_ejection_percent: 50
          health_checks:
            - timeout: 1s
              interval: 5s
              unhealthy_threshold: 3
              healthy_threshold: 1
              http_health_check: { path: /readyz }
          load_assignment:
            cluster_name: titan_api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ $api }}-headless.{{ .Release.Namespace }}.svc.cluster.local
                          port_value: 8080
        - name: otel_collector
          type: STRICT_DNS
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: otel_collector
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ regexReplaceAll "^https?://([^:/]+).*$" .Values.otel.endpoint "${1}" }}
                          port_value: {{ regexReplaceAll "^.*:([0-9]+)/?$" .Values.otel.endpoint "${1}" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "titan.component" $c }}
  labels:
    {{- include "titan.labels" $c | nindent 4 }}
spec:
  {{- if not $v.autoscaling.enabled }}
  replicas: {{ $v.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "titan.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "titan.podLabels" $c | nindent 8 }}
      annotations:
        checksum/config: {{ $v | toJson | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: /stats/prometheus
    spec:
      serviceAccountName: {{ include "titan.component" $c }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- include "titan.podSecurity" . | nindent 6 }}
      {{- include "titan.topologySpread" $c | nindent 6 }}
      containers:
        - name: envoy
          image: {{ include "titan.image" $v.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --log-level
            - {{ $v.logLevel }}
            - --concurrency
            - {{ $v.concurrency | quote }}
            - --drain-time-s
            - "15"
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: admin, containerPort: 9901, protocol: TCP }
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ include "titan.component" $c }}
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "titan.component" $c }}
  labels:
    {{- include "titan.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "titan.selectorLabels" $c | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http, appProtocol: http }
    - { name: http-admin, port: 9901, targetPort: admin, appProtocol: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "titan.component" $c }}
  labels:
    {{- include "titan.labels" $c | nindent 4 }}
spec:
  minAvailable: {{ $v.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "titan.selectorLabels" $c | nindent 6 }}
{{- if $v.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "titan.component" $c }}
  labels:
    {{- include "titan.labels" $c | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "titan.component" $c }}
  minReplicas: {{ $v.autoscaling.minReplicas }}
  maxReplicas: {{ $v.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $v.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
