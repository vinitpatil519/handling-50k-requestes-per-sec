{{- if .Values.ingress.enabled }}
{{- $c := dict "root" . "name" "nginx" -}}
# Optional cloud entry point. On EKS with the AWS Load Balancer Controller
# set className=alb and the alb.ingress.kubernetes.io/* annotations in
# environments/eks/values.yaml. Traffic still flows through the NGINX tier.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "titan.fullname" . }}
  labels:
    {{- include "titan.labels" $c | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "titan.component" $c }}
                port:
                  name: http
{{- end }}
