{{- $pg := .Values.postgres -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "titan.component" (dict "root" . "name" "secrets") }}
  labels:
    {{- include "titan.labels" (dict "root" . "name" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- if not $pg.auth.existingSecret }}
  password: {{ $pg.auth.password | quote }}
  {{- if $pg.enabled }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" $pg.auth.username (urlquery $pg.auth.password) (include "titan.postgresHost" .) $pg.auth.database | quote }}
  {{- else }}
  database-url: {{ required "externalDatabase.url is required when postgres.enabled=false" .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ .Values.redis.password | quote }}
  {{- else }}
  redis-password: {{ .Values.externalRedis.password | quote }}
  {{- end }}
