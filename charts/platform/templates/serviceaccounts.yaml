{{- /*
One ServiceAccount per workload: Istio AuthorizationPolicies match on the
SPIFFE identity derived from it, and no workload needs the Kubernetes API,
so tokens are not mounted.
*/ -}}
{{- range $name := list "api" "worker" "web" "envoy" "nginx" "postgres" "redis" "kafka" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "titan.component" (dict "root" $ "name" $name) }}
  labels:
    {{- include "titan.labels" (dict "root" $ "name" $name) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
