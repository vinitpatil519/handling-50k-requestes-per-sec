# TitanEdge local stack (no Kubernetes needed).
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build                 # core
#   docker compose -f deploy/compose/docker-compose.yml --profile obs up -d --build   # + observability
#   docker compose -f deploy/compose/docker-compose.yml --profile load run --rm titanload \
#       run -u http://nginx:8080/api/v1/ping -c 128 -d 30s --no-dashboard
#
# Entry point: http://localhost:8080 (NGINX -> Envoy -> API / Next.js)
name: titanedge

x-logging: &logging
  # Docker keeps a local copy for `docker compose logs` (dual logging) while
  # shipping to Fluent Bit. fluentd-async means containers start even when
  # the obs profile (and therefore Fluent Bit) is not running.
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async: "true"
    tag: "titan.{{.Name}}"

x-go-env: &go-env
  LOG_LEVEL: info
  DATABASE_URL: postgres://titan:titan@postgres:5432/titan?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: titan.events
  KAFKA_PARTITIONS: "12"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  TRACE_SAMPLE_RATIO: "0.05"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan
      POSTGRES_DB: titan
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: build/go.Dockerfile
      args: { CMD: api }
    image: titanedge/api:dev
    environment:
      <<: *go-env
      OTEL_SERVICE_NAME: titan-api
      MIGRATE_ON_START: "true"
      DB_MAX_CONNS: "20"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1.0", memory: 256M }
    logging: *logging
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: build/go.Dockerfile
      args: { CMD: worker }
    image: titanedge/worker:dev
    environment:
      <<: *go-env
      OTEL_SERVICE_NAME: titan-worker
    depends_on:
      api: { condition: service_started }
    deploy:
      replicas: 2
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: ../../web
    image: titanedge/web:dev
    environment:
      API_BASE_URL: http://envoy:8080
      GRAFANA_URL: http://localhost:3001
      PROMETHEUS_URL: http://localhost:9090
      JAEGER_URL: http://localhost:16686
    logging: *logging
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.39.1
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn", "--concurrency", "2"]
    volumes: ["./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    depends_on: [api]
    logging: *logging
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080"]
    depends_on: [envoy, web]
    ulimits:
      nofile: { soft: 200000, hard: 200000 }
    logging: *logging
    restart: unless-stopped

  # ---------------------------------------------------------------- observability
  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./otel/otel-collector.yaml:/etc/otel/config.yaml:ro"]

  jaeger:
    profiles: [obs]
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../charts/platform/files/prometheus-rules.yaml:/etc/prometheus/rules/titanedge.yaml:ro
    ports: ["9090:9090"]

  loki:
    profiles: [obs]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./loki/loki.yaml:/etc/loki/loki.yaml:ro"]

  fluent-bit:
    profiles: [obs]
    image: fluent/fluent-bit:5.1.2
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes: ["./fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro"]
    ports: ["24224:24224"]
    depends_on: [loki]

  grafana:
    profiles: [obs]
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../charts/platform/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, loki, jaeger]

  # ---------------------------------------------------------------- load
  titanload:
    profiles: [load]
    build:
      context: ../..
      dockerfile: build/go.Dockerfile
      args: { CMD: titanload }
    image: titanedge/titanload:dev
    ulimits:
      nofile: { soft: 200000, hard: 200000 }

volumes:
  pgdata:
