# Receives container logs from Docker's fluentd logging driver and ships them
# to Loki. JSON log lines are parsed so fields become queryable.
service:
  flush: 1
  log_level: warn
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

pipeline:
  inputs:
    - name: forward
      listen: 0.0.0.0
      port: 24224

  filters:
    - name: parser
      match: "titan.*"
      key_name: log
      parser: json
      reserve_data: on

  outputs:
    - name: loki
      match: "titan.*"
      host: loki
      port: 3100
      labels: job=compose, container=$container_name
      line_format: json
      auto_kubernetes_labels: off

parsers:
  - name: json
    format: json
