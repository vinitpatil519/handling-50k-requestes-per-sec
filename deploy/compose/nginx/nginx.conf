# NGINX edge for docker compose (nginx-unprivileged image, listens on 8080).
# The Kubernetes version lives in charts/platform/templates/nginx-configmap.yaml.
worker_processes auto;
worker_rlimit_nofile 200000;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 65535;
  multi_accept on;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 100000;
  reset_timedout_connection on;
  client_max_body_size 1m;

  # Log all 5xx plus a 1% sample; full access logs at 100k rps cost more CPU
  # than proxying.
  split_clients "${request_id}" $sampled { 1% 1; * 0; }
  map $status $is_error { ~^5 1; default 0; }
  map "$sampled$is_error" $loggable { "00" 0; default 1; }
  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"urt":"$upstream_response_time","request_id":"$request_id",'
                              '"ua":"$http_user_agent"}';
  access_log /dev/stdout json if=$loggable;

  gzip on;
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  upstream envoy {
    server envoy:8080;
    keepalive 512;
    keepalive_requests 100000;
    keepalive_timeout 60s;
  }

  upstream web {
    server web:3000;
    keepalive 64;
  }

  server {
    listen 8080 reuseport backlog=65535;
    server_name _;
    # h2c prior knowledge and HTTP/1.1 share the port (titanload -m http2).
    http2 on;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/v1/ {
      proxy_pass http://envoy;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      add_header X-Request-ID $request_id always;
    }

    location /_next/static/ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # Internal status endpoint for nginx-prometheus-exporter.
  server {
    listen 8081;
    location = /stub_status {
      stub_status;
      access_log off;
    }
  }
}
