# Permissions for the Jenkins service account:
#  - titanedge: `helm upgrade` in DEPLOY_MODE=helm (Argo CD does it in gitops mode)
#  - titanload: run the post-deploy performance gate pod
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: titanedge
rules:
  - apiGroups: ["", "apps", "batch", "policy", "autoscaling", "networking.k8s.io", "rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["monitoring.coreos.com", "keda.sh", "security.istio.io", "networking.istio.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: titanedge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-loadtest
  namespace: titanload
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/attach]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-loadtest
  namespace: titanload
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-loadtest
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
