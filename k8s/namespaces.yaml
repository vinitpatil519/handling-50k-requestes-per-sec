# Namespaces used by TitanEdge. Pod Security Admission "baseline" is enforced
# everywhere and "restricted" is audited/warned so violations are visible.
# The istio-injection label is added by scripts/install-addons.sh when the
# full profile (Istio) is installed.
apiVersion: v1
kind: Namespace
metadata:
  name: titanedge
  labels:
    app.kubernetes.io/part-of: titanedge
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: titanload
  labels:
    app.kubernetes.io/part-of: titanedge
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: titanedge
    # node-exporter needs host access.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: titanedge
    # Fluent Bit reads /var/log from the host.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels:
    app.kubernetes.io/part-of: titanedge
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: titanedge
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
  labels:
    app.kubernetes.io/part-of: titanedge
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    app.kubernetes.io/part-of: titanedge
