# Kind cluster for TitanEdge: 1 control-plane + 3 workers.
#   kind create cluster --name titan --config kind/cluster.yaml
# (scripts/kind-up.sh does this and wires the local image registry.)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: titan
networking:
  # Plenty of pod IPs for aggressive HPA scale-out tests.
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
# Let nodes pull from the local registry at localhost:5001 (see kind-up.sh).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        maxPods: 250
    # Host ports -> NodePorts. Edge on 8080, tools on their usual ports.
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, protocol: TCP }   # NGINX edge (app + API)
      - { containerPort: 30300, hostPort: 3000, protocol: TCP }   # Grafana
      - { containerPort: 30090, hostPort: 9090, protocol: TCP }   # Prometheus
      - { containerPort: 30686, hostPort: 16686, protocol: TCP }  # Jaeger UI
      - { containerPort: 30443, hostPort: 8443, protocol: TCP }   # Argo CD
      - { containerPort: 30880, hostPort: 8081, protocol: TCP }   # Jenkins
  - role: worker
    labels: { titan/pool: app }
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            max-pods: "250"
  - role: worker
    labels: { titan/pool: app }
  - role: worker
    labels: { titan/pool: data }
